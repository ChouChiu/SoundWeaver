name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            exe: soundweaver
          - os: windows-latest
            target: windows-x86_64
            exe: soundweaver.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Build renderer
        working-directory: renderer
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build:page
          # Bundle npm packages into the CLI scripts, the packaged app ships no node_modules
          bun build src/cli/main.ts --outfile dist/render.mjs --target node
          bun build src/cli/soundfield.ts --outfile dist/soundfield.mjs --target node
          bun build src/cli/player.ts --outfile dist/player.mjs --target node

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        env:
          # Offscreen Qt for the UI suite; no native build in CI, native tests self-skip
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Build with PyInstaller
        run: |
          uv run --with pyinstaller pyinstaller \
            --noconfirm --clean --onedir --windowed \
            --name soundweaver \
            --paths src \
            --exclude-module tkinter \
            --add-data "src/soundweaver/locales:soundweaver/locales" \
            --add-data "renderer/dist:renderer/dist" \
            src/soundweaver/__main__.py

      - name: Smoke test
        run: |
          test -f dist/soundweaver/${{ matrix.exe }}
          test -f dist/soundweaver/_internal/renderer/dist/render.mjs
          test -f dist/soundweaver/_internal/soundweaver/locales/zh_cn.json
          test -f dist/soundweaver/_internal/soundweaver/locales/en.json
          test -f dist/soundweaver/_internal/soundweaver/locales/zh_tw.json

      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf soundweaver-${{ matrix.target }}.tar.gz soundweaver

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/soundweaver -DestinationPath soundweaver-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: soundweaver-${{ matrix.target }}
          path: soundweaver-${{ matrix.target }}.*
          if-no-files-found: error
