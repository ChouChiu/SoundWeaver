[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soundweaver"
version = "0.1.0"
description = "SoundWeaver - Dolby Atmos, 360RA and Audio Vivid production studio: stem split, ADM BWF masters, lyric and spatial video rendering"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11",
  "pyside6>=6.11.2",
  "pyside6-fluent-widgets>=1.8",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
]

[project.scripts]
soundweaver = "soundweaver.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soundweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Function:DeprecationWarning:qframelesswindow",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# native/ keeps upstream tooling; only first-party Python is linted.
extend-exclude = ["native"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import order
  "B",   # bugbear
  "UP",  # pyupgrade
  "RUF", # ruff-specific
]
# E501: dense CJK docstrings routinely exceed 100 cols; RUF001-003: CJK fullwidth punctuation.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
