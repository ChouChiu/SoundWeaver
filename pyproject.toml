[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dolbytool"
version = "0.1.0"
description = "Dolby Atmos stem split, cover gradient, scrolling waveform and lyric video tool"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11",
  "pyside6>=6.11.2",
  "pyside6-fluent-widgets>=1.8",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
]

[project.scripts]
dolbytool = "dolbytool.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dolbytool"]

[tool.ruff]
target-version = "py311"
line-length = 100
